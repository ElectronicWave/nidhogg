[package]
name = "nidhogg"
version = "0.3.0"
authors = ["Gebardensprache <gebardensprache@proton.me>", "H2Sxxx <h2sxxa0w0@gmail.com>"]
edition = "2024"
license = "AGPL-3.0"
homepage = "https://github.com/ElectronicWave/nidhogg"
repository = "https://github.com/ElectronicWave/nidhogg"
description = "Authenticator for Yggdrasil server"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "stream", "default-tls", "multipart"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
base64 = "0.23.1"
url = { version = "2.5.7", optional = true }
md-5 = { version = "0.11.0", optional = true }
rsa = { version = "0.10.0", features = ["getrandom", "pkcs1v15"], optional = true }
sha1 = { version = "0.11.0", features = ["oid"], optional = true }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }

[features]
default = []
authlib-injector = []
authlib-injector-embed = ["authlib-injector"]
server = ["dep:md-5", "dep:rsa", "dep:sha1", "dep:url"]
