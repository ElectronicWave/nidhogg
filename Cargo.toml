[package]
name = "nidhogg"
version = "0.1.0"
authors = ["Gebardensprache <gebardensprache@proton.me>"]
edition = "2024"
license = "AGPL-3"
homepage = "https://github.com/ElectronicWave/nidhogg"
repository = "https://github.com/ElectronicWave/nidhogg"
description = "Authenticator for Yggdrasil server"

[dependencies]
reqwest = { version = "0.13.5", features = ["json", "stream", "default-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
base64 = "0.23.1"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }